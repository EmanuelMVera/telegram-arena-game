<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>Telegram Arena Game</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

  <body>
    <div id="mobile-controls">
      <div class="left-controls">
        <button id="btn-left" type="button">◀</button>
        <button id="btn-right" type="button">▶</button>
      </div>

      <div class="right-controls">
        <button id="btn-jump" type="button">⤒</button>
        <button id="btn-attack" type="button">⚔</button>
      </div>
    </div>

    <button id="btn-orientation" type="button" aria-label="Rotar pantalla">⟳</button>

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
